<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>IMC Calculator</title>
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
            referrerpolicy="no-referrer"
        />
        <link rel="stylesheet" href="css/styles.css" />
    </head>
    <body>
        <div class="app">
            <!--Estructura de la aplicacion aqui -->

            <h1>Caluladora IMC</h1>

            <div class="form">
                <form id="imcForm">

                    <!-- Sexo -->
                    <div class="form-sexo">
                        <p class="form-label">Sexo</p>
                        <div class="toggle toggle--lg" role="group" aria-label="Sexo">
                            <label class="toggle__btn">
                                <input id="sexoHombre" type="radio" name="sexo" value="hombre" checked />
                                <span class="toggle__content">
                                    <i class="fa-solid fa-mars" aria-hidden="true"></i>
                                    <span>Hombre</span>
                                </span>
                            </label>

                            <label class="toggle__btn">
                                <input id="sexoMujer" type="radio" name="sexo" value="mujer" />
                                <span class="toggle__content">
                                    <i class="fa-solid fa-venus" aria-hidden="true"></i>
                                    <span>Mujer</span>
                                </span>
                            </label>
                        </div>
                    </div>

                    <!-- Altura y peso -->
                    <div class="altura">
                        <label for="alturaCm">Altura y peso</label>
                        <div class="form-altura">
                            <div class="field-header">
                                <label for="alturaCm">Unidad:</label>
                                <div class="toggle toggle--sm" role="group" aria-label="Unidad de altura">
                                    <label class="toggle__btn">
                                        <input id="alturaCmOption" type="radio" name="alturaUnidad" value="cm" checked />
                                        <span class="toggle__content">cm</span>
                                    </label>
                                    <label class="toggle__btn">
                                        <input id="alturaFtInOption" type="radio" name="alturaUnidad" value="ftin" />
                                        <span class="toggle__content">ft/in</span>
                                    </label>
                                </div>
                            </div>

                            <!-- Altura -->
                            <div class="field-inputs">
                                <!-- Altura en cm -->
                                <div id="alturaCmWrap">
                                    <input type="number" id="alturaCm" name="alturaCm" step="0.1" placeholder="Ej: 170 (cm)" required />
                                </div>

                                <!-- Altura en ft/in -->
                                <div id="alturaFtInWrap" class="is-hidden altura-ftin">
                                    <input type="number" id="alturaFt" name="alturaFt" step="1" min="0" placeholder="Ej: 5 (ft)" />
                                    <input type="number" id="alturaIn" name="alturaIn" step="1" min="0" placeholder="Ej: 6 (in)" />
                                </div>
                            </div>  
                        </div>
                    </div>

                    <div class="peso">
                        <label for="pesoLb">Peso</label>
                        <div class="form-peso">
                            <div class="field-header">
                                <label for="pesoValor">Unidad:</label>
                                <div class="toggle toggle--sm" role="group" aria-label="Unidad de peso">
                                    <label class="toggle__btn">
                                        <input id="pesoKgOption" type="radio" name="pesoUnidad" value="kg" checked />
                                        <span class="toggle__content">kg</span>
                                    </label>
                                    <label class="toggle__btn">
                                        <input id="pesoLbOption" type="radio" name="pesoUnidad" value="lb" />
                                        <span class="toggle__content">lb</span>
                                    </label>
                                </div>
                            </div>

                            <div class="field-inputs">
                                <div id="pesoLbWrap" class=" is-hidden">
                                    <input type="number" id="pesoLb" name="pesoLb" step="0.1" placeholder="Ej: 170 (lb)" required />
                                </div>

                                <div id="pesoKgWrap">
                                    <input type="number" id="pesoKg" name="pesoKg" step="0.1" placeholder="Ej: 70 (kg)" required />
                                </div>
                            </div>  
                        </div>
                    </div>

                    <!-- Boton de calcular -->
                    <div class="btnContainer">
                        <button id="calcularBtn" class="btn" type="submit">Calcular</button>
                    </div>
                </form>
            </div>

            <div id="resultado" class="Resultado is-hidden">
                <h2>Resultado</h2>
                <p id="ValorIMC"></p>
                <p id="ClasificacionIMC"></p>
            </div>
        </div>

        <script src="js/script.js"></script>
    </body>
</html>
